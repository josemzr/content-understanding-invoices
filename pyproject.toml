[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-understanding-invoices"
version = "0.1.0"
description = "Compare Azure Content Understanding and Document Intelligence on invoices and delivery notes."
requires-python = ">=3.11"
dependencies = [
    "azure-ai-contentunderstanding>=1.1.0,<2.0.0",
    "azure-ai-documentintelligence>=1.0.0,<2.0.0",
    "azure-identity>=1.24.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[project.scripts]
invoice-demo = "invoice_demo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_demo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]